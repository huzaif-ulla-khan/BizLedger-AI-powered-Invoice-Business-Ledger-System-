{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 shadow-sm">
      <h4 class="card-title mb-3">Register</h4>
      <form method="post">
        <div class="mb-3"><input class="form-control" name="username" placeholder="Username" required></div>
        <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
        <div class="d-grid"><button class="btn btn-success">Create account</button></div>
      </form>
      <hr>
      <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
